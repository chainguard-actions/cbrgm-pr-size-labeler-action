name: Test repository format input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action correctly handles the github_repository input
      # in owner/repository format. We use the real repository from the context.
      # The action will fail because PR #1 may or may not exist, but we're
      # testing that the repository format is accepted.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pr_number: "1"

      - name: Assert action ran with repository format input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should not be skipped - it should have run
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          # Whether it succeeded or failed, it ran - that's what we're testing
          # (PR #1 may or may not exist in the repo)
          echo "PASS: action ran with owner/repository format (outcome: $OUTCOME)"
