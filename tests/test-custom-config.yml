name: Test PR Size Labeler - Custom Config File
on:
  workflow_dispatch:

jobs:
  test-custom-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Write a custom config file for the action
      - name: Create custom PR size labeler config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pr-size-config.yml" <<'EOF'
          exclude_files:
            - "*.md"
            - "*.txt"
          label_configs:
            - size: xs
              diff: 10
              files: 1
              labels: ["size/xs"]
            - size: s
              diff: 50
              files: 5
              labels: ["size/s"]
            - size: m
              diff: 200
              files: 15
              labels: ["size/m"]
            - size: l
              diff: 1000
              files: 30
              labels: ["size/l"]
            - size: xl
              diff: 5000
              files: 100
              labels: ["size/xl"]
          added_lines_only: false
          EOF

      # Run the action with a custom config file and invalid PR number — expect failure on API call
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pr_number: "99999999"
          config_file_path: "tests/fixtures/pr-size-config.yml"

      - name: Assert action failed on nonexistent PR (not on config parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with nonexistent PR 99999999, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for nonexistent PR (config file was accepted)"
