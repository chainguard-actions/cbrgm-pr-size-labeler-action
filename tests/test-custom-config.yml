name: Test custom config file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Verify fixture config file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/pr-size-labeler.yml" ]; then
            echo "FAIL: fixture config file not found"
            exit 1
          fi
          echo "PASS: fixture config file found"
          cat "$GITHUB_WORKSPACE/tests/fixtures/pr-size-labeler.yml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_number: "999999999"
          github_repository: ${{ github.repository }}
          config_file_path: "tests/fixtures/pr-size-labeler.yml"

      - name: Assert action failed for non-existent PR (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent PR with custom config"
