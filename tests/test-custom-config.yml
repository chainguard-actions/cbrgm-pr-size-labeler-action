name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom config file
        run: |
          mkdir -p /tmp/pr-size-labeler-config
          cat > /tmp/pr-size-labeler-config/config.yml <<'EOF'
          labels:
            - name: "size/XS"
              lines: 0
              files: 0
            - name: "size/S"
              lines: 10
              files: 2
            - name: "size/M"
              lines: 30
              files: 5
            - name: "size/L"
              lines: 100
              files: 10
            - name: "size/XL"
              lines: 500
              files: 20
            - name: "size/XXL"
              lines: 1000
              files: 50
          EOF
          echo "Config file created at /tmp/pr-size-labeler-config/config.yml"
          cat /tmp/pr-size-labeler-config/config.yml
      - name: Test action with custom config
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: fake-token-for-testing
          github_pr_number: "42"
          github_repository: octocat/Hello-World
          config_file_path: /tmp/pr-size-labeler-config/config.yml
      - name: Assert action attempted to run with custom config
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail because the token is fake.
          # We verify it ran (not skipped) and failed due to API error, not a config error.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with custom config (outcome: ${{ steps.action.outcome }})"
