name: Test PR Size Labeler - Custom Config File
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a custom config file to pass to the action
      - name: Create custom config file
        run: |
          mkdir -p /tmp/pr-labeler-config
          cat > /tmp/pr-labeler-config/config.yml <<'EOF'
          xs:
            label: "size/XS"
            max_lines: 10
          s:
            label: "size/S"
            max_lines: 50
          m:
            label: "size/M"
            max_lines: 150
          l:
            label: "size/L"
            max_lines: 500
          xl:
            label: "size/XL"
            max_lines: 1000
          xxl:
            label: "size/XXL"
          EOF
          echo "Config file created at /tmp/pr-labeler-config/config.yml"
          cat /tmp/pr-labeler-config/config.yml

      # Invoke the action with a custom config file path.
      # With a fake token the Docker container will fail with an API error,
      # confirming the action is correctly wired with the config_file_path input.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          github_pr_number: "1"
          github_repository: octocat/Hello-World
          config_file_path: /tmp/pr-labeler-config/config.yml

      - name: Assert action ran with custom config (expected failure with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid.
          # A 'failure' outcome means the Docker container ran and exited non-zero,
          # which is the correct behaviour when credentials are invalid.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran with custom config and failed as expected with invalid credentials"
