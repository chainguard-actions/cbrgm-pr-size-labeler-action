name: Test custom config file path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture config file to workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/custom-config"
          cp "$GITHUB_WORKSPACE/tests/fixtures/pull-request-size.yml" \
             "$GITHUB_WORKSPACE/custom-config/pr-size.yml"
          echo "Config file contents:"
          cat "$GITHUB_WORKSPACE/custom-config/pr-size.yml"

      - name: Find an open or closed PR to test with
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Try to find an open PR number using the GitHub API
          PR_NUMBER=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls?state=open&per_page=1" \
            | grep -o '"number":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")

          if [ -z "$PR_NUMBER" ]; then
            # Try closed PRs
            PR_NUMBER=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls?state=closed&per_page=1" \
              | grep -o '"number":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            echo "No PRs found in repository, skipping test"
          else
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
            echo "Found PR #$PR_NUMBER"
          fi

      - name: Run PR size labeler with custom config file
        id: action
        if: steps.find-pr.outputs.SKIP != 'true'
        uses: .
        with:
          github_token: ${{ github.token }}
          github_repository: ${{ github.repository }}
          github_pr_number: ${{ steps.find-pr.outputs.PR_NUMBER }}
          config_file_path: 'custom-config/pr-size.yml'

      - name: Assert action ran successfully with custom config
        if: steps.find-pr.outputs.SKIP != 'true'
        run: |
          echo "PASS: PR size labeler action completed successfully with custom config for PR #${{ steps.find-pr.outputs.PR_NUMBER }}"

      - name: Skip notice
        if: steps.find-pr.outputs.SKIP == 'true'
        run: |
          echo "SKIP: No PRs found in repository - skipping label assertion"
          echo "PASS: Action setup with custom config verified (no PRs available to label)"
