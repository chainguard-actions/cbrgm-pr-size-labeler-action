name: Test custom config file path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a custom config file for the labeler
      - name: Create custom config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github"
          cat > "$GITHUB_WORKSPACE/.github/pr-size-custom.yml" <<'EOF'
          # Custom PR Size Labeler configuration
          exclude_files:
            - "*.md"
            - "*.txt"
          label_configs:
            - size: xs
              diff: 10
              files: 1
              labels: ["size/xs"]
            - size: s
              diff: 50
              files: 5
              labels: ["size/s"]
            - size: m
              diff: 200
              files: 15
              labels: ["size/m"]
            - size: l
              diff: 1000
              files: 30
              labels: ["size/l"]
            - size: xl
              diff: 5000
              files: 100
              labels: ["size/xl"]
          added_lines_only: false
          EOF
          echo "Config file created:"
          cat "$GITHUB_WORKSPACE/.github/pr-size-custom.yml"

      # The action requires a real PR number. Since we don't have one in the
      # test environment, we use PR #999999 which should not exist.
      # We expect the action to fail (non-zero exit) because the PR doesn't exist.
      # The key thing we're testing here is that the custom config_file_path input
      # is accepted and the action starts up correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pr_number: "999999"
          config_file_path: ".github/pr-size-custom.yml"

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should not be skipped - it should have run
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          # Whether it succeeded or failed, it ran - that's what we're testing
          echo "PASS: action ran with custom config file path (outcome: $OUTCOME)"
