name: Test custom config file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pr-size-labeler.yml" <<'EOF'
          labels:
            - name: "size/XS"
              min: 0
              max: 10
            - name: "size/S"
              min: 11
              max: 30
            - name: "size/M"
              min: 31
              max: 100
            - name: "size/L"
              min: 101
              max: 500
            - name: "size/XL"
              min: 501
              max: -1
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_pr_number: "1"
          github_repository: ${{ github.repository }}
          config_file_path: "${{ github.workspace }}/tests/fixtures/pr-size-labeler.yml"
      - name: Assert action ran with custom config (fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or PR not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
