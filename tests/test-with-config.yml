name: Test PR size labeler with config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write a minimal config file for the labeler
      - name: Create config file
        run: |
          mkdir -p /tmp/pr-labeler-config
          cat > /tmp/pr-labeler-config/labeler.yml << 'EOF'
          size/XS:
            max_lines_changed: 10
            max_files_changed: 5
            color: "00aabb"
          size/S:
            max_lines_changed: 50
            max_files_changed: 10
            color: "00bb00"
          size/M:
            max_lines_changed: 200
            max_files_changed: 20
            color: "ffbb00"
          size/L:
            max_lines_changed: 500
            max_files_changed: 30
            color: "ff6600"
          size/XL:
            max_lines_changed: 1000
            max_files_changed: 50
            color: "ff0000"
          size/XXL:
            color: "cc0000"
          EOF
          echo "Config file created at /tmp/pr-labeler-config/labeler.yml"
          cat /tmp/pr-labeler-config/labeler.yml

      # The action makes real GitHub API calls; with a fake token it will
      # exit non-zero. We use continue-on-error and assert it ran.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "fake-token-for-testing"
          github_pr_number: "1"
          github_repository: "cbrgm/pr-size-labeler-action"
          config_file_path: "/tmp/pr-labeler-config/labeler.yml"

      - name: Assert action ran with config (outcome is not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with config file, outcome=$OUTCOME (failure expected with fake token)"
