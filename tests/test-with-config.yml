name: Test with config file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal config file
        run: |
          mkdir -p /tmp/pr-labeler-config
          cat > /tmp/pr-labeler-config/config.yml << 'EOF'
          xs:
            label: "size/XS"
            max_lines: 10
            max_files: 2
          s:
            label: "size/S"
            max_lines: 50
            max_files: 5
          m:
            label: "size/M"
            max_lines: 200
            max_files: 10
          l:
            label: "size/L"
            max_lines: 500
            max_files: 20
          xl:
            label: "size/XL"
            max_lines: 1000
            max_files: 50
          xxl:
            label: "size/XXL"
          EOF
          echo "Config file created at /tmp/pr-labeler-config/config.yml"
          cat /tmp/pr-labeler-config/config.yml
      - name: Invoke PR size labeler action with config file
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "fake-token-for-testing"
          github_pr_number: "42"
          github_repository: "octocat/Hello-World"
          config_file_path: "/tmp/pr-labeler-config/config.yml"
      - name: Assert action attempted to run with config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (API error),
          # not because of a missing config file or Docker startup failure.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config file and failed as expected (invalid token / API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
