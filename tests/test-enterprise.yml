name: Test PR Size Labeler with GitHub Enterprise URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run PR Size Labeler with enterprise URL (expect failure due to invalid token/PR)
        id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          github_pr_number: "1"
          github_repository: octocat/Hello-World
          github_enterprise_url: https://github.example.com
        continue-on-error: true
      - name: Assert action ran with enterprise URL input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail because the token and enterprise URL are fake.
          # The important thing is that the github_enterprise_url input was accepted and passed.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with github_enterprise_url input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
