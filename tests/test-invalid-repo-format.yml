name: Test invalid repository format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal config file so the action doesn't fail on config loading
      - name: Create config file
        run: |
          mkdir -p .github
          cat > .github/pull-request-size.yml <<'EOF'
          label_configs:
            - size: XS
              diff: 10
              files: 5
              labels:
                - size/XS
            - size: S
              diff: 30
              files: 10
              labels:
                - size/S
            - size: M
              diff: 100
              files: 20
              labels:
                - size/M
            - size: L
              diff: 500
              files: 50
              labels:
                - size/L
            - size: XL
              diff: 1000
              files: 100
              labels:
                - size/XL
          EOF

      - name: Run action with invalid repository format
        id: action
        # The action should exit cleanly (exit 0) when repo format is invalid
        # It prints "Repository name is in the wrong format. Expected 'owner/repository'"
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_number: "1"
          github_repository: "invalid-repo-format-no-slash"

      - name: Assert action completed without error
        run: |
          echo "PASS: action exited cleanly with invalid repo format"
