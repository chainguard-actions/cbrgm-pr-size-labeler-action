name: Test nonexistent PR number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal config file so the action doesn't fail on config loading
      - name: Create config file
        run: |
          mkdir -p .github
          cat > .github/pull-request-size.yml <<'EOF'
          label_configs:
            - size: XS
              diff: 10
              files: 5
              labels:
                - size/XS
            - size: S
              diff: 30
              files: 10
              labels:
                - size/S
            - size: M
              diff: 100
              files: 20
              labels:
                - size/M
            - size: L
              diff: 500
              files: 50
              labels:
                - size/L
            - size: XL
              diff: 1000
              files: 100
              labels:
                - size/XL
          EOF

      - name: Run action with nonexistent PR number
        id: action
        # PR number 999999999 almost certainly does not exist
        # The action should fail with a GitHub API 404 error
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_number: "999999999"
          github_repository: ${{ github.repository }}

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with nonexistent PR, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given a nonexistent PR number"
