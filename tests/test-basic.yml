name: Test basic usage - invalid PR number
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        name: Run PR size labeler with non-existent PR number
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_repository: ${{ github.repository }}
          github_pr_number: "999999999"

      - name: Assert action ran and failed with API error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because PR 999999999 does not exist,
          # but it should NOT fail due to missing inputs or misconfiguration.
          # A failure here means the action was invoked correctly and attempted
          # to call the GitHub API.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected (PR does not exist)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
