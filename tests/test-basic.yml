name: Test PR Size Labeler - Basic Invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action makes real GitHub API calls, so with a fake token it will
      # fail with an authentication/API error — not a configuration error.
      # We capture the exit code and assert it is non-zero (expected failure
      # due to invalid credentials), confirming the action is correctly wired.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          github_pr_number: "1"
          github_repository: octocat/Hello-World

      - name: Assert action ran (expected failure with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid / PR doesn't exist.
          # A 'failure' outcome means the Docker container ran and exited non-zero,
          # which is the correct behaviour when credentials are invalid.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran and failed as expected with invalid credentials"
