name: Test basic usage - label PR with default config
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create default config file
        run: |
          mkdir -p .github
          cat > .github/pull-request-size.yml << 'EOF'
          label_configs:
            - size: xs
              diff: 25
              files: 1
              labels: ["size/xs"]
            - size: s
              diff: 150
              files: 10
              labels: ["size/s"]
            - size: m
              diff: 600
              files: 25
              labels: ["size/m"]
            - size: l
              diff: 2500
              files: 50
              labels: ["size/l"]
            - size: xl
              diff: 5000
              files: 100
              labels: ["size/xl"]
          added_lines_only: false
          EOF

      - name: Find an open PR to test with
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Try to find an open PR number using the GitHub API
          PR_NUMBER=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls?state=open&per_page=1" \
            | grep -o '"number":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")

          if [ -z "$PR_NUMBER" ]; then
            # Try closed PRs
            PR_NUMBER=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls?state=closed&per_page=1" \
              | grep -o '"number":[0-9]*' | head -1 | grep -o '[0-9]*' || echo "")
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            echo "No PRs found in repository, skipping test"
          else
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
            echo "Found PR #$PR_NUMBER"
          fi

      - name: Run PR size labeler action
        id: action
        if: steps.find-pr.outputs.SKIP != 'true'
        uses: .
        with:
          github_token: ${{ github.token }}
          github_repository: ${{ github.repository }}
          github_pr_number: ${{ steps.find-pr.outputs.PR_NUMBER }}

      - name: Assert action ran successfully
        if: steps.find-pr.outputs.SKIP != 'true'
        run: |
          echo "PASS: PR size labeler action completed successfully for PR #${{ steps.find-pr.outputs.PR_NUMBER }}"

      - name: Skip notice
        if: steps.find-pr.outputs.SKIP == 'true'
        run: |
          echo "SKIP: No PRs found in repository - skipping label assertion"
          echo "PASS: Action setup verified (no PRs available to label)"
