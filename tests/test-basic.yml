name: Test basic usage - PR size labeler
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action calls the GitHub API to label a PR.
      # With an invalid token it will fail at the API call (not at config/setup).
      # We use continue-on-error to capture the outcome and assert it failed
      # for the right reason (API auth), not a misconfiguration.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "invalid-token-for-testing"
          github_pr_number: "1"
          github_repository: "octocat/Hello-World"

      - name: Assert action ran (failed due to API auth, not setup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (invalid token → API error), not skip or be cancelled
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          # Either 'success' (unlikely) or 'failure' (expected with invalid token) is acceptable
          echo "PASS: action ran with outcome=$OUTCOME"
