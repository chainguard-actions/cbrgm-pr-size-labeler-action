name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Invoke PR size labeler action (expect API failure, not startup failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "fake-token-for-testing"
          github_pr_number: "1"
          github_repository: "octocat/Hello-World"
      - name: Assert action attempted to run (API error expected, not missing-input error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (API error),
          # not because of a missing required input or Docker startup failure.
          # A failure outcome here means the action ran and tried to call the API.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected (invalid token / API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
