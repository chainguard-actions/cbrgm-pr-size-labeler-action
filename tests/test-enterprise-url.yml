name: Test github_enterprise_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_pr_number: "99999999"
          github_repository: ${{ github.repository }}
          github_enterprise_url: "https://github.com"
      - name: Assert action ran with enterprise_url input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail because PR 99999999 does not exist,
          # but the important thing is that the github_enterprise_url input
          # was accepted and the action attempted to run (not a config error).
          # We accept both success and failure outcomes here.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: github_enterprise_url input was accepted and action ran"
