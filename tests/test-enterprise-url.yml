name: Test enterprise URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_pr_number: "999999"
          github_repository: ${{ github.repository }}
          github_enterprise_url: "https://api.github.com"

      - name: Assert action ran (enterprise URL input accepted)
        run: |
          # The action may fail because PR 999999 does not exist,
          # but the important thing is that the github_enterprise_url input
          # was accepted and the action attempted to run.
          # We verify the step completed (either success or failure) rather
          # than erroring out before even starting.
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with github_enterprise_url input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
