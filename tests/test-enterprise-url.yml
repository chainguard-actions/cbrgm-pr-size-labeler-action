name: Test enterprise URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          github_pr_number: "1"
          github_repository: octocat/Hello-World
          github_enterprise_url: https://github.example.com
      - name: Assert action ran with enterprise URL input
        run: |
          # The action will fail because the token/repo/PR are fake,
          # but we only need to verify the input was accepted (not rejected as unknown).
          # The action exits non-zero due to API auth failure, not due to unknown input.
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: github_enterprise_url input was accepted by the action"
