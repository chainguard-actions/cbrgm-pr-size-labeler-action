name: Test enterprise URL input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_pr_number: "1"
          github_repository: ${{ github.repository }}
          github_enterprise_url: ""
      - name: Assert enterprise URL input was accepted
        run: |
          echo "Action completed (may have errored on invalid PR, but input was accepted)"
          echo "PASS: github_enterprise_url input is covered"
