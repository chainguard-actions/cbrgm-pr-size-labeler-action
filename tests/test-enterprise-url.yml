name: Test github_enterprise_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run PR size labeler with github_enterprise_url input
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ github.token }}
          github_pr_number: "1"
          github_repository: ${{ github.repository }}
          github_enterprise_url: "https://github.com"

      - name: Assert action was invoked with enterprise URL input
        run: |
          # The action may fail because PR #1 may not exist or may be closed,
          # but what matters is that the github_enterprise_url input was accepted
          # and the action was invoked. We verify the step ran (outcome is set).
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with github_enterprise_url input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
