name: Test PR size labeler with GitHub Enterprise URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action makes real GitHub API calls; with a fake token and
      # enterprise URL it will exit non-zero. We use continue-on-error
      # and assert it ran (Docker container started successfully).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "fake-token-for-testing"
          github_pr_number: "1"
          github_repository: "cbrgm/pr-size-labeler-action"
          github_enterprise_url: "https://github.example.com"

      - name: Assert action ran with enterprise URL (outcome is not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with enterprise URL, outcome=$OUTCOME (failure expected with fake token/URL)"
