name: Test github_enterprise_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a real PR number and token to succeed.
      # When github_enterprise_url is set to a non-existent GHE host,
      # the action will attempt to connect to it and fail — which is the
      # expected behavior. We use continue-on-error to capture the outcome
      # and assert that the step failed (proving the input was accepted and used).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_pr_number: "1"
          github_repository: ${{ github.repository }}
          github_enterprise_url: "https://github.example-enterprise.invalid"

      - name: Assert enterprise URL input was accepted (action attempted to use it)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have failed because the GHE URL is unreachable,
          # which proves the github_enterprise_url input was passed through and used.
          # Either 'failure' (connection refused / DNS error) is acceptable.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when using an invalid enterprise URL"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
