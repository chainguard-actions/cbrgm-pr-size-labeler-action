name: Test PR Size Labeler with GitHub Enterprise URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-enterprise-test
          github_pr_number: "1"
          github_repository: octocat/hello-world
          github_enterprise_url: https://github.example.com
      - name: Assert enterprise URL input was accepted
        run: |
          echo "Action completed (with or without error due to fake credentials)"
          echo "The github_enterprise_url input was passed to the action."
          echo "PASS: input coverage verified"
