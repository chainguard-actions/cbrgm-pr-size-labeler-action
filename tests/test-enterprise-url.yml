name: Test enterprise URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token
          github_pr_number: "1"
          github_repository: octocat/hello-world
          github_enterprise_url: https://github.example.com
      - name: Assert enterprise URL input was accepted
        run: |
          # The action is expected to fail when connecting to a fake enterprise URL,
          # but the input must be accepted (not rejected as unknown).
          # continue-on-error above ensures we reach this step.
          echo "github_enterprise_url input was passed to the action"
          echo "PASS: input coverage verified"
